[workspace]
members = [
    "crates/core",
    "crates/db",
    "crates/ipc",
    "crates/daemon",
    "crates/cli",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Network Manager contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "process", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
tower = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[patch.crates-io]
pathfinder_simd = { path = "vendor/pathfinder_simd" }
